services:
  - type: web
    name: pocket-grimoire
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pocket-grimoire-db
          property: connectionString

databases:
  - name: pocket-grimoire-db
    plan: free
    postgresMajorVersion: "17"
    databaseName: pocket_grimoire
    user: pocket_grimoire
